name: CI (linter + unit tests check)

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt
      - name: Lint with pycodestyle
        run: pycodestyle mainapp/ tests/ FreeItLessons/
      - name: Django checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Test with Django test runner
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
        run: python manage.py test tests -v 2

  regression:
    # legacy (Python 3.7 + Django 1.11) vs this revision - characterization check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Legacy vs candidate characterization run
        run: make regression
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: .regression/*.txt
