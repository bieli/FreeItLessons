name: CI (linter + unit tests check)

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt
      - name: Lint with pycodestyle
        run: pycodestyle mainapp/ tests/ FreeItLessons/
      - name: Django checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Test with Django test runner
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
        run: |
          python manage.py collectstatic --noinput -v0
          python manage.py test tests -v 2

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: React unit tests + production build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  e2e:
    # the same browser spec against the jQuery UI (baseline branch) and the React UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Playwright - jQuery UI vs React UI
        env:
          BASE_REF: origin/upgrade/python312-django61
        run: make e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .e2e/report

  regression:
    # legacy (Python 3.7 + Django 1.11) vs this revision - characterization check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Legacy vs candidate characterization run
        run: make regression
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: .regression/*.txt
